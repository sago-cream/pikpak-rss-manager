name: Public image smoke
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GHCR tag to test without registry credentials
        required: true
        default: latest
        type: string
permissions:
  contents: read
jobs:
  anonymous-compose:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
      SMOKE_PLATFORM: linux/${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Anonymous pull
        run: |
          docker logout ghcr.io || true
          docker pull --platform "$SMOKE_PLATFORM" "$IMAGE"
      - name: Expected application version
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "SMOKE_EXPECTED_VERSION=v${IMAGE_TAG#v}" >> "$GITHUB_ENV"
          elif [[ "$IMAGE_TAG" == "latest" || "$IMAGE_TAG" == "main" ]]; then
            echo "SMOKE_EXPECTED_VERSION=$(cat cmd/pikpak-rss-manager/VERSION)" >> "$GITHUB_ENV"
          fi
      - name: Compose startup and persisted data from the published image
        run: python3 scripts/container-smoke.py "$IMAGE"
      - name: Both architectures available anonymously
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json
          python3 -c 'import json; m=json.load(open("manifest.json"))["manifests"]; p={(x.get("platform",{}).get("os"),x.get("platform",{}).get("architecture")) for x in m}; assert {("linux","amd64"),("linux","arm64")} <= p, p'
