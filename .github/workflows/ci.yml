name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Tests with race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: UI syntax and localization
        run: node --check internal/web/static/app.js && node --check internal/web/static/i18n.js && node scripts/test-i18n.cjs
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath ./cmd/pikpak-rss-manager
          test "$(./pikpak-rss-manager version)" = "$(cat cmd/pikpak-rss-manager/VERSION)"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container
        run: docker build -t pikpak-rss-manager:ci .
      - name: Startup, authentication, non-root and persisted data
        run: SMOKE_EXPECTED_VERSION="$(cat cmd/pikpak-rss-manager/VERSION)" python3 scripts/container-smoke.py pikpak-rss-manager:ci
