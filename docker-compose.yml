services:
  pikpak-rss-manager:
    image: ghcr.io/wade00754/pikpak-rss-manager:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Please set a unique administrator password of 12-72 bytes}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Bind PAT in the Web UI by default; it is stored encrypted in this volume.
    volumes:
      - pikpak-rss-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/pikpak-rss-manager", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pikpak-rss-data:
