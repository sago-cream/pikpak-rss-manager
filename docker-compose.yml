services:
  pikpak-rss-manager:
    image: ghcr.io/wade00754/pikpak-rss-manager:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # Initialize the administrator and bind PAT in the Web UI.
    volumes:
      - pikpak-rss-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/pikpak-rss-manager", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pikpak-rss-data:
