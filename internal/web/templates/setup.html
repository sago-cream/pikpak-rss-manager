<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>PikPak RSS · 首次設定</title><link rel="stylesheet" href="/static/app.css"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><script src="/static/i18n.js" defer></script><script src="/static/app.js" defer></script></head>
<body class="login-page setup-page"><main class="login-shell"><select class="language-select" aria-label="語言"><option value="zh-Hant">繁體中文</option><option value="en">English</option></select><div class="brand-mark">P<span>↗</span></div><h1>首次設定</h1><form id="setup-form" class="login-form"><label for="setup-password">管理密碼</label><input id="setup-password" type="password" autocomplete="new-password" required placeholder="設定你的管理密碼"><label for="setup-confirm">再次輸入管理密碼</label><input id="setup-confirm" type="password" autocomplete="new-password" required placeholder="確認管理密碼"><label for="setup-public-url">網站網址</label><input id="setup-public-url" type="url" placeholder="https://rss.example.com"><p class="field-help">預填目前網址；使用反向代理時填入對外網址。</p><label class="checkbox-label"><input id="setup-private-feeds" type="checkbox">允許存取內網 RSS</label><p class="field-help">僅在訂閱來源位於內網時啟用。</p><button class="button primary" type="submit">建立管理員</button><p id="setup-error" class="error" role="alert"></p></form><div class="login-footer"><span class="version">{{.Version}}</span></div></main></body></html>
