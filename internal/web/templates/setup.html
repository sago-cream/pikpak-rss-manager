<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><script src="/static/theme.js"></script><title>PikPak RSS · 首次設定</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/theme.css"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><script src="/static/i18n.js" defer></script><script src="/static/app.js" defer></script></head>
<body class="login-page setup-page"><main class="login-shell"><div class="login-header"><img class="brand-mark" src="/static/favicon.svg" alt=""><div class="appearance-controls"><button type="button" class="theme-toggle" aria-label="切換深色模式" title="切換深色模式" aria-pressed="false">☾</button><button type="button" class="language-toggle" lang="en" aria-label="切換為英文">English</button></div></div>{{template "onboarding-progress" "administrator"}}<h1>首次設定</h1><form id="setup-form" class="login-form form-stack"><div class="form-field"><label for="setup-password">密碼</label><input id="setup-password" type="password" autocomplete="new-password" required placeholder="密碼"></div><div class="form-field"><label for="setup-confirm">再次輸入密碼</label><input id="setup-confirm" type="password" autocomplete="new-password" required placeholder="相同密碼"></div><div class="form-field"><div class="field-label-row"><label for="setup-public-url">網站網址</label><button type="button" class="info-trigger" popovertarget="setup-url-help" aria-label="網站網址說明">{{template "info-icon"}}</button><div id="setup-url-help" class="field-popover" popover><p>預填目前網址。使用反向代理時填入對外網址。</p></div></div><input id="setup-public-url" type="url" placeholder="https://rss.example.com" aria-describedby="setup-url-help"></div><div class="field-label-row setup-private-feeds"><label class="checkbox-label"><input id="setup-private-feeds" type="checkbox" aria-describedby="setup-private-help"><span>允許存取內網 RSS</span></label><button type="button" class="info-trigger" popovertarget="setup-private-help" aria-label="內網 RSS 說明">{{template "info-icon"}}</button><div id="setup-private-help" class="field-popover" popover><p>僅在訂閱來源位於內網時啟用。</p></div></div><button class="button primary" type="submit">下一步</button><p id="setup-error" class="error" role="alert"></p></form></main></body></html>
