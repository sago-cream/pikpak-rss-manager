<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>PikPak RSS · 首次設定</title><link rel="stylesheet" href="/static/app.css"><script src="/static/app.js" defer></script></head>
<body class="login-page setup-page"><main class="login-shell"><div class="brand-mark">P<span>↗</span></div><div class="eyebrow">WELCOME TO YOUR WORKSPACE</div><h1>先設定，<br>再開始追蹤。</h1><p class="muted">建立管理密碼，保護你的個人工作空間。<br>完成後即可在網頁綁定 PikPak。</p><form id="setup-form" class="login-form"><label for="setup-password">管理密碼</label><input id="setup-password" type="password" autocomplete="new-password" required placeholder="設定你的管理密碼"><label for="setup-confirm">再次輸入管理密碼</label><input id="setup-confirm" type="password" autocomplete="new-password" required placeholder="確認管理密碼"><p class="field-help">密碼僅保存雜湊，不保存原文。</p><label for="setup-public-url">網站網址</label><input id="setup-public-url" type="url" placeholder="https://rss.example.com"><p class="field-help">預填目前網址；使用反向代理時填入對外網址。</p><label class="checkbox-label"><input id="setup-private-feeds" type="checkbox">允許存取內網 RSS</label><p class="field-help">僅在訂閱來源位於內網時啟用。</p><button class="button primary" type="submit">建立管理員並繼續 <span>→</span></button><p id="setup-error" class="error" role="alert"></p></form><div class="login-footer"><span class="dot"></span> 個人自託管 · 官方 PikPak MCP <span class="version">{{.Version}}</span></div></main><aside class="login-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="floating-card"><span class="mini-label">你的工作空間</span><strong>從第一次設定開始</strong><span class="code">RSS → PikPak</span><div class="art-check">✓</div></div><div class="art-note">ONLY IN YOUR CLOUD</div></aside></body></html>
