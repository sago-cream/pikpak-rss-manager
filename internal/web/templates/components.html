{{define "info-icon"}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg>{{end}}
{{define "pat-field"}}<div class="form-field"><div class="field-label-row"><label for="token">個人存取權杖（PAT）</label><button type="button" class="info-trigger" popovertarget="token-permissions" aria-label="PAT 權限說明">{{template "info-icon"}}</button></div><input id="token" type="password" autocomplete="off" required placeholder="貼上 PAT" aria-describedby="token-permissions"><div id="token-permissions" class="field-popover" popover><p>PAT 需具備「讀寫檔案」及「雲端下載」權限。</p></div></div>{{end}}
{{define "pat-create-link"}}<p class="field-help pat-create-copy">還沒有 PAT 嗎？ <a class="text-link" href="https://mypikpak.com/en-US/help-center/connected_apps/personal_access_tokens/create_personal_access_token" target="_blank" rel="noopener noreferrer">建立 PAT</a></p>{{end}}
