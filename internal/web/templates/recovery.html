<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><script src="/static/theme.js"></script><title>忘記密碼 · PikPak RSS</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/theme.css"><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><script src="/static/i18n.js" defer></script><script src="/static/app.js" defer></script></head>
<body class="login-page setup-page"><main class="login-shell"><div class="login-header"><img class="brand-mark" src="/static/favicon.svg" alt=""><div class="appearance-controls"><button type="button" class="theme-toggle" aria-label="切換深色模式" title="切換深色模式" aria-pressed="false">☾</button><button type="button" class="language-toggle" lang="en" aria-label="切換為英文">English</button></div></div><h1 id="recovery-title">忘記密碼</h1>
<div id="recovery-help" class="recovery-help"><p class="field-help">在伺服器取得復原碼：</p><code class="recovery-command" translate="no">docker compose exec pikpak-rss-manager /app/pikpak-rss-manager recovery-code</code><details><summary>本機執行</summary><code class="recovery-command" translate="no">pikpak-rss-manager recovery-code</code><p class="field-help">請使用原本的 APP_DATA_DIR。</p></details><p class="field-help">復原碼 15 分鐘內有效，只能使用一次。</p></div>
<form id="recovery-form" class="login-form"><div class="setup-field"><label for="recovery-code">復原碼</label><input id="recovery-code" type="password" autocomplete="off" required></div><div class="setup-field"><label for="recovery-password">新密碼</label><input id="recovery-password" type="password" autocomplete="new-password" required></div><div class="setup-field"><label for="recovery-confirm">再次輸入新密碼</label><input id="recovery-confirm" type="password" autocomplete="new-password" required></div><button class="button primary" type="submit">重設密碼</button><p id="recovery-error" class="error" role="alert"></p></form><p id="recovery-success" class="field-help hidden" role="status">請使用新密碼登入。</p><a class="text-link recovery-back" href="/">返回登入</a></main></body></html>
